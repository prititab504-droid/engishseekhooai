<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaAI — Conversational English Coach</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    
    .app-card { background: #1e293b; border-radius: 24px; border: 1px solid #334155; box-shadow: 0 20px 40px rgba(0,0,0,0.5); width: 100%; max-width: 480px; display: flex; flex-direction: column; height: 92vh; overflow: hidden; }
    
    /* Header & Settings */
    .header { background: #1e293b; border-bottom: 1px solid #334155; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .avatar { width: 40px; height: 40px; background: linear-gradient(135deg, #6366f1, #a855f7); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.1rem; }
    .title-group h1 { font-size: 1.05rem; font-weight: 600; }
    .title-group p { font-size: 0.75rem; color: #94a3b8; }
    
    .config-bar { background: #0f172a; padding: 10px 16px; border-bottom: 1px solid #334155; display: flex; flex-direction: column; gap: 8px; }
    .config-row { display: flex; gap: 8px; align-items: center; }
    .config-bar input, .config-bar select { background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 8px 12px; border-radius: 8px; font-size: 0.8rem; outline: none; }
    .config-bar input { flex: 1; }
    .config-bar select { flex: 1; cursor: pointer; }
    
    /* Chat Stream */
    .chat-container { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; }
    
    .message-group { display: flex; flex-direction: column; gap: 6px; max-width: 85%; }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.ai { align-self: flex-start; align-items: flex-start; }
    
    .message { padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; line-height: 1.45; word-wrap: break-word; }
    .user .message { background: #6366f1; color: white; border-bottom-right-radius: 4px; }
    .ai .message { background: #334155; color: #f8fafc; border-bottom-left-radius: 4px; }
    
    /* Correction Card */
    .grammar-card { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 8px 12px; font-size: 0.8rem; color: #fca5a5; display: flex; flex-direction: column; gap: 2px; width: 100%; }
    .grammar-card strong { color: #f87171; font-weight: 600; }
    
    /* Control Footer */
    .controls { padding: 16px; background: #1e293b; border-top: 1px solid #334155; display: flex; flex-direction: column; align-items: center; gap: 12px; }
    
    .action-row { display: flex; align-items: center; justify-content: center; gap: 20px; width: 100%; }
    
    .mic-btn { width: 68px; height: 68px; border-radius: 50%; background: linear-gradient(135deg, #6366f1, #4f46e5); border: none; color: white; font-size: 1.6rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4); }
    .mic-btn:hover { transform: scale(1.05); }
    .mic-btn.listening { background: linear-gradient(135deg, #ef4444, #dc2626); animation: wave 1.2s infinite; box-shadow: 0 4px 20px rgba(239, 68, 68, 0.5); }
    
    @keyframes wave {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    
    .speed-tag { font-size: 0.75rem; color: #94a3b8; background: #0f172a; padding: 4px 8px; border-radius: 12px; border: 1px solid #334155; }
    .status-text { font-size: 0.8rem; color: #94a3b8; font-weight: 500; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="avatar" id="avatarIcon">S</div>
      <div class="title-group">
        <h1 id="tutorName">Sophia</h1>
        <p id="tutorRole">Conversational Tutor</p>
      </div>
    </div>
    <span class="speed-tag" id="speedDisplay">0.9x Speed</span>
  </div>

  <!-- Settings Bar -->
  <div class="config-bar">
    <div class="config-row">
      <input type="password" id="apiKey" placeholder="OpenAI API Key (or test mock responses)">
    </div>
    <div class="config-row">
      <select id="scenarioSelect">
        <option value="casual">Casual Chat (Sophia)</option>
        <option value="interview">Job Interviewer (Mr. Vance)</option>
        <option value="cafe">Coffee Shop Barista (Alex)</option>
      </select>
      <select id="speedSelect">
        <option value="0.8">0.8x (Beginner)</option>
        <option value="0.9" selected>0.9x (Natural)</option>
        <option value="1.0">1.0x (Normal)</option>
      </select>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chatContainer">
    <div class="message-group ai">
      <div class="message">
        Hi there! I'm Sophia. Tap the microphone and tell me about your day!
      </div>
    </div>
  </div>

  <!-- Speech Controls -->
  <div class="controls">
    <div class="action-row">
      <button class="mic-btn" id="micBtn">🎤</button>
    </div>
    <div class="status-text" id="statusText">Tap microphone to speak</div>
  </div>
</div>

<script>
  // App State
  const scenarios = {
    casual: { name: 'Sophia', role: 'Conversational Tutor', avatar: 'S', prompt: 'You are Sophia, a friendly, encouraging English tutor. Keep replies short (1-2 sentences). Ask a natural follow-up question.' },
    interview: { name: 'Mr. Vance', role: 'Hiring Manager', avatar: 'V', prompt: 'You are Mr. Vance, interviewing the user for a job. Keep replies formal and brief (1-2 sentences). Ask relevant interview questions.' },
    cafe: { name: 'Alex', role: 'Coffee Shop Barista', avatar: 'A', prompt: 'You are Alex, a barista taking orders. Be energetic, concise, and stay in character.' }
  };

  // DOM Elements
  const chatContainer = document.getElementById('chatContainer');
  const micBtn = document.getElementById('micBtn');
  const statusText = document.getElementById('statusText');
  const apiKeyInput = document.getElementById('apiKey');
  const scenarioSelect = document.getElementById('scenarioSelect');
  const speedSelect = document.getElementById('speedSelect');
  const speedDisplay = document.getElementById('speedDisplay');
  const tutorName = document.getElementById('tutorName');
  const tutorRole = document.getElementById('tutorRole');
  const avatarIcon = document.getElementById('avatarIcon');

  let currentScenario = 'casual';
  let speechRate = 0.9;

  // Web Speech API Initialization
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'en-US';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.innerText = 'Listening... Speak clearly';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Tap microphone to speak';
    };

    recognition.onresult = async (e) => {
      const transcript = e.results[0][0].transcript;
      appendUserMessage(transcript);
      await processLanguageResponse(transcript);
    };

    recognition.onerror = () => {
      statusText.innerText = 'Speech recognition error. Please try again.';
    };
  }

  // Handle Scenario and Settings Changes
  scenarioSelect.addEventListener('change', (e) => {
    currentScenario = e.target.value;
    const info = scenarios[currentScenario];
    tutorName.innerText = info.name;
    tutorRole.innerText = info.role;
    avatarIcon.innerText = info.avatar;
    appendAiMessage(`Mode changed to **${info.role}**. Let's practice!`);
  });

  speedSelect.addEventListener('change', (e) => {
    speechRate = parseFloat(e.target.value);
    speedDisplay.innerText = `${speechRate}x Speed`;
  });

  micBtn.addEventListener('click', () => {
    if (!SpeechRecognition) {
      alert('Speech API not supported in this browser. Use Chrome or Edge.');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      recognition.start();
    }
  });

  // UI Helper Functions
  function appendUserMessage(text) {
    const group = document.createElement('div');
    group.className = 'message-group user';
    group.innerHTML = `<div class="message">${escapeHtml(text)}</div>`;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function appendAiMessage(text, correction = null) {
    const group = document.createElement('div');
    group.className = 'message-group ai';
    
    let html = `<div class="message">${escapeHtml(text)}</div>`;
    if (correction) {
      html += `
        <div class="grammar-card">
          <strong>💡 Quick Grammar Tip:</strong>
          <span>${escapeHtml(correction)}</span>
        </div>`;
    }
    
    group.innerHTML = html;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = speechRate;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Core Processing Engine
  async function processLanguageResponse(userInput) {
    statusText.innerText = 'Analyzing & responding...';
    const key = apiKeyInput.value.trim();

    if (key) {
      try {
        const scenario = scenarios[currentScenario];
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            response_format: { type: "json_object" },
            messages: [
              { 
                role: 'system', 
                content: `${scenario.prompt} Respond STRICTLY in this JSON format: {"reply": "your conversation reply", "correction": "grammatical correction if user made a mistake, otherwise empty string"}` 
              },
              { role: 'user', content: userInput }
            ]
          })
        });

        const data = await response.json();
        const parsed = JSON.parse(data.choices[0].message.content);
        
        appendAiMessage(parsed.reply, parsed.correction || null);
        speakText(parsed.reply);
      } catch (err) {
        appendAiMessage("API connection error. Please check your key or internet.");
      }
    } else {
      // Offline fallback demo logic
      const demoReply = `Great sentence! In our ${scenarios[currentScenario].role} session, practicing daily builds real fluency.`;
      const demoCorrection = userInput.toLowerCase().includes("i goes") ? "Say 'I go' instead of 'I goes'." : null;
      
      appendAiMessage(demoReply, demoCorrection);
      speakText(demoReply);
    }
    statusText.innerText = 'Tap microphone to speak';
  }
</script>
</body>
</html>
