<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seekho AI — English Coach</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background: #0f172a; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    
    .app-card { 
      background: #1e293b; 
      border-radius: 24px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
      width: 100%; 
      max-width: 450px; 
      display: flex; 
      flex-direction: column; 
      height: 92vh; 
      overflow: hidden; 
    }
    
    .header { 
      background: #0f172a; 
      padding: 16px 20px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .avatar-glow { 
      width: 42px; 
      height: 42px; 
      background: linear-gradient(135deg, #6366f1, #a855f7); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 700; 
      font-size: 1.2rem; 
      color: white;
    }
    
    .title-group h1 { font-size: 1.1rem; font-weight: 700; color: white;}
    .title-group p { font-size: 0.75rem; color: #34d399; }
    
    .chat-container { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 14px; 
    }

    .message-group { display: flex; flex-direction: column; gap: 6px; max-width: 90%; }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.ai { align-self: flex-start; align-items: flex-start; }
    
    .message { padding: 12px 16px; border-radius: 18px; font-size: 0.92rem; line-height: 1.45; word-wrap: break-word; }
    .user .message { background: #6366f1; color: white; border-bottom-right-radius: 4px; }
    .ai .message { background: #334155; color: #f8fafc; border-bottom-left-radius: 4px; }

    .lesson-card { 
      background: rgba(168, 85, 247, 0.12); 
      border: 1px solid rgba(168, 85, 247, 0.3); 
      border-radius: 14px; 
      padding: 10px 14px; 
      font-size: 0.82rem; 
      color: #e9d5ff; 
      width: 100%; 
    }
    .tip-box { background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; margin-top: 4px; border-left: 3px solid #6366f1; }

    .controls { 
      padding: 16px; 
      background: #0f172a; 
      border-top: 1px solid rgba(255, 255, 255, 0.08); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
    }
    
    .input-row { display: flex; gap: 8px; width: 100%; }
    .text-input { 
      flex: 1; 
      background: #1e293b; 
      border: 1px solid #334155; 
      color: white; 
      padding: 12px 16px; 
      border-radius: 24px; 
      outline: none; 
      font-size: 0.9rem;
    }
    
    .send-btn, .mic-btn { 
      border: none; 
      color: white; 
      cursor: pointer; 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      transition: all 0.2s ease;
    }
    
    .send-btn { width: 44px; height: 44px; background: #6366f1; font-size: 1.1rem; }
    .mic-btn { width: 56px; height: 56px; background: linear-gradient(135deg, #a855f7, #6366f1); font-size: 1.5rem; }
    .mic-btn.listening { background: #ef4444; animation: pulse 1.2s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    
    .status-text { font-size: 0.8rem; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="avatar-glow">S</div>
    <div class="title-group">
      <h1>Seekho AI Coach</h1>
      <p>● Voice & Text Mode Active</p>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message-group ai">
      <div class="message">
        Namaste! 🎙️ Hindi me boliye ya niche type karein. Main English me convert karke sikhaungi!
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn">🎤</button>
    <div class="input-row">
      <input type="text" class="text-input" id="textInput" placeholder="Boliye ya Hindi/Hinglish type karein...">
      <button class="send-btn" id="sendBtn">➔</button>
    </div>
    <div class="status-text" id="statusText">Tap mic or type a message</div>
  </div>
</div>

<script>
  const chatContainer = document.getElementById('chatContainer');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  const textInput = document.getElementById('textInput');
  const statusText = document.getElementById('statusText');

  // Speech Recognition Initializer
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.innerText = 'Listening... Speak in Hindi/Hinglish now';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Tap mic or type a message';
    };

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      processInput(transcript);
    };

    recognition.onerror = (e) => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Mic issue detected. You can type below!';
    };
  } else {
    statusText.innerText = 'Voice not supported in browser. Use typing input below!';
  }

  // Mic Click Listener
  micBtn.addEventListener('click', async () => {
    if (!SpeechRecognition) {
      alert('Speech input not supported on this browser version. Use text input!');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        window.speechSynthesis.cancel();
        recognition.start();
      } catch (err) {
        statusText.innerText = '⚠️ Mic access denied. Allow permissions in browser settings.';
      }
    }
  });

  // Text Send Listener
  sendBtn.addEventListener('click', () => {
    const val = textInput.value.trim();
    if (val) {
      processInput(val);
      textInput.value = '';
    }
  });

  textInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') {
      sendBtn.click();
    }
  });

  function processInput(userInput) {
    appendMessage(userInput, 'user');
    statusText.innerText = 'Processing...';

    setTimeout(() => {
      const res = generateBilingualResponse(userInput);
      appendMessage(res.englishReply, 'ai', res.lessonHTML);
      speakEnglish(res.englishReply);
      statusText.innerText = 'Tap mic or type a message';
    }, 600);
  }

  function appendMessage(text, sender, lessonHTML = null) {
    const group = document.createElement('div');
    group.className = `message-group ${sender}`;
    let html = `<div class="message">${escapeHtml(text)}</div>`;
    if (lessonHTML) html += lessonHTML;
    group.innerHTML = html;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function speakEnglish(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      window.speechSynthesis.speak(utterance);
    }
  }

  function generateBilingualResponse(inputStr) {
    const input = inputStr.toLowerCase();
    let engText = "";
    let lessonBody = "";

    if (input.includes("kaise ho") || input.includes("kaise h") || input.includes("how are you")) {
      engText = "I am doing great, thank you! How are you today?";
      lessonBody = `
        <strong>💡 Translation & Tip:</strong>
        Aapne bola: "${inputStr}"
        <div class="tip-box">
          Daily English fluency: "I am fine" ki jagah <em>"I am doing great"</em> use karein.
        </div>
      `;
    } else if (input.includes("naam") || input.includes("name")) {
      engText = "My name is Seekho AI. What is your name?";
      lessonBody = `
        <strong>💡 Learning Corner:</strong>
        Apna naam batane ke liye:
        <div class="tip-box">
          <em>"My name is [Your Name]"</em> bolein.
        </div>
      `;
    } else if (input.includes("seekhna") || input.includes("learn") || input.includes("english")) {
      engText = "I will help you speak fluent English every day!";
      lessonBody = `
        <strong>💡 Fluency Tip:</strong>
        English sikhne ka golden rule:
        <div class="tip-box">
          Sochne aur bolne me direct English use karein, Hindi se mind translation avoid karein.
        </div>
      `;
    } else {
      engText = `I understood: "${inputStr}". Keep practicing to build confidence!`;
      lessonBody = `
        <strong>💡 English Coach Tip:</strong>
        <div class="tip-box">
          Pehle chote-chote sentences bolein. Mistakes se mat dariye, fluency practice se hi aayegi.
        </div>
      `;
    }

    return {
      englishReply: engText,
      lessonHTML: `<div class="lesson-card">${lessonBody}</div>`
    };
  }
</script>
</body>
</html>
