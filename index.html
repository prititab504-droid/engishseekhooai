<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bilingual English Seekho AI</title>

  <style>
    /* GLOBAL STYLES */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    
    body { 
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); 
      color: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 12px;
      margin: 0;
    }
    
    /* MAIN APPLICATION CARD */
    .app-card { 
      background: rgba(255, 255, 255, 0.05); 
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 30px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5); 
      width: 100%; 
      max-width: 450px; 
      display: flex; 
      flex-direction: column; 
      height: 92vh; 
      overflow: hidden; 
      position: relative;
    }
    
    /* HEADER */
    .header { 
      background: rgba(15, 23, 42, 0.8); 
      padding: 16px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      z-index: 10;
    }
    
    .brand-group { display: flex; align-items: center; gap: 12px; }
    .avatar-glow { 
      width: 44px; 
      height: 44px; 
      background: linear-gradient(135deg, #6366f1, #a855f7); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 700; 
      font-size: 1.2rem; 
      color: white;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }
    
    .title-group h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.2px; color: white;}
    .title-group p { font-size: 0.75rem; color: #94a3b8; }
    
    /* CHAT MESSAGES CONTAINER */
    .chat-container { 
      flex: 1; 
      padding: 20px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 18px; 
      scroll-behavior: smooth; 
    }
    
    .chat-container::-webkit-scrollbar { width: 5px; }
    .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 5px; }

    /* MESSAGE BUBBLES */
    .message-group { display: flex; flex-direction: column; gap: 8px; max-width: 90%; }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.ai { align-self: flex-start; align-items: flex-start; }
    
    .message { 
      padding: 14px 18px; 
      border-radius: 22px; 
      font-size: 0.95rem; 
      line-height: 1.5; 
      word-wrap: break-word; 
    }
    .user .message { 
      background: linear-gradient(135deg, #6366f1, #4f46e5); 
      color: white; 
      border-bottom-right-radius: 4px; 
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .ai .message { 
      background: rgba(255, 255, 255, 0.08); 
      color: #f8fafc; 
      border-bottom-left-radius: 4px; 
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* BILINGUAL INSTRUCTION CARD */
    .lesson-card { 
      background: rgba(168, 85, 247, 0.1); 
      border: 1px solid rgba(168, 85, 247, 0.3); 
      border-radius: 16px; 
      padding: 12px 16px; 
      font-size: 0.85rem; 
      color: #e9d5ff; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      width: 100%; 
    }
    .lesson-card strong { color: #d8b4fe; font-weight: 600; display: flex; align-items: center; gap: 6px; }
    
    .tip-box { background: rgba(255,255,255,0.05); padding: 8px; border-radius: 8px; border-left: 3px solid #6366f1; }

    /* CONTROLS AREA */
    .controls { 
      padding: 20px; 
      background: rgba(15, 23, 42, 0.8); 
      border-top: 1px solid rgba(255, 255, 255, 0.08); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 14px; 
    }
    
    .mic-btn { 
      width: 72px; 
      height: 72px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #a855f7, #6366f1); 
      border: none; 
      color: white; 
      font-size: 1.8rem; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      transition: all 0.2s ease; 
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4); 
      position: relative;
    }
    .mic-btn:hover { transform: scale(1.06); }
    .mic-btn.listening { 
      background: linear-gradient(135deg, #ef4444, #dc2626); 
      animation: pulse 1.4s infinite; 
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.5); 
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    
    .status-text { font-size: 0.85rem; color: #94a3b8; font-weight: 500; text-align: center; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- Header -->
  <div class="header">
    <div class="brand-group">
      <div class="avatar-glow">S</div>
      <div class="title-group">
        <h1>Seekho AI</h1>
        <p>Your Hindi-English Coach</p>
      </div>
    </div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chatContainer">
    <div class="message-group ai">
      <div class="message">
        Namaste! 🎙️ Mic pakdiye aur Hindi me boliye. Main usko English me convert karke reply karungi aur fluency tips bhi dungi!
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="mic-btn" id="micBtn">🎤</button>
    <div class="status-text" id="statusText">Tap mic & speak Hindi/Hinglish</div>
  </div>
</div>

<script>
  // Elements
  const chatContainer = document.getElementById('chatContainer');
  const micBtn = document.getElementById('micBtn');
  const statusText = document.getElementById('statusText');

  // Speech Recognition Setup (Hindi)
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false; // Stop after one sentence
    recognition.lang = 'hi-IN'; // Listen for Hindi/Hinglish
    recognition.interimResults = false;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.innerText = 'Suno raha hoon... Boliye...';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Tap mic to speak again';
    };

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      handleUserSpeech(transcript);
    };

    recognition.onerror = () => {
      statusText.innerText = 'Error: Mic range se bahar hai. Try again.';
    };
  }

  micBtn.addEventListener('click', () => {
    if (!SpeechRecognition) {
      alert('Your browser does not support voice input. Please use Chrome or Edge.');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      window.speechSynthesis.cancel(); // Stop AI speaking if it was
      recognition.start();
    }
  });

  // Handle Speech Logic
  function handleUserSpeech(hindiInput) {
    // 1. Add User Bubble
    appendMessage(hindiInput, 'user');

    // 2. Generate Bilingual Lesson & English Reply
    statusText.innerText = 'Converting...';
    
    // OFFLINE logic simulator (since we have no API connection)
    setTimeout(() => {
      let result = generateOfflineBilingualResponse(hindiInput);
      
      // 3. Add AI Bubble
      appendMessage(result.englishReply, 'ai', result.lessonHTML);
      
      // 4. Speak English Reply
      speakEnglish(result.englishReply);
      
    }, 1000);
  }

  function appendMessage(text, sender, lessonHTML = null) {
    const group = document.createElement('div');
    group.className = `message-group ${sender}`;
    
    let html = `<div class="message">${text}</div>`;
    
    if (lessonHTML) {
      html += lessonHTML;
    }
    
    group.innerHTML = html;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to bottom
  }

  function speakEnglish(text) {
    if ('speechSynthesis' in window) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9; // Slightly slower for clarity
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }
  }

  // Simulator for Demo purposes (Translates known phrases)
  function generateOfflineBilingualResponse(hindiInput) {
    const input = hindiInput.toLowerCase();
    let engText = "";
    let lessonBody = "";

    if (input.includes("kaise हो") || input.includes("kaise ho") || input.includes("how are you")) {
      engText = "I am doing great, thank you! How about you?";
      lessonBody = `
        <strong>💡 Translation & Fluency Tip:</strong>
        Aapne bola: "${hindiInput}" (How are you?)
        <div class="tip-box">
          Fluent banne ke liye, sirfer "I am fine" mat boliye. Use advanced phrases like <em>"I'm doing great"</em> or <em>"I'm pretty good."</em>
        </div>
      `;
    } else if (input.includes("naam") || input.includes("name")) {
      engText = "My name is Seekho AI. It is nice to meet you.";
      lessonBody = `
        <strong>💡 Learning Corner:</strong>
        Aapne apna naam pucha.
        <div class="tip-box">
          English grammar me "Mera naam..." ko handle karne ke liye simple path hai: <em>"My name is [Name]"</em>. "Nice to meet you" bolna politeness increase karta hai.
        </div>
      `;
    } else if (input.includes("english seekhna") || input.includes("learn english")) {
      engText = "That is a wonderful goal! Let's practice every day.";
      lessonBody = `
        <strong>💡 Goal Setting Tip:</strong>
        English seekhne ke liye consistency zaruri hai.
        <div class="tip-box">
          Fluency tips in both languages: Rozana 10 minutes practice karein. Think directly in English, don't translate internally.
        </div>
      `;
    } else {
      // Fallback for unknown input
      engText = `You said "${hindiInput}". Keep speaking, and I will help you become fluent.`;
      lessonBody = `
        <strong>💡 General Fluency Tip:</strong>
        <div class="tip-box">
          Aap grammar rules me confuse mat hoiye. Pehle confidence gain karein, fir correctness (accuracy) par dhyan dein. Small sentences se shuru karein.
        </div>
      `;
    }

    return {
      englishReply: engText,
      lessonHTML: `<div class="lesson-card">${lessonBody}</div>`
    };
  }
</script>
</body>
</html>
