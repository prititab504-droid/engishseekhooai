<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seekho AI — Fast English Coach</title>

  <style>
    :root {
      --bg: #0b1329;
      --card-bg: #16203a;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.4);
      --success: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --user-bubble: #4f46e5;
      --ai-bubble: #1e293b;
      --card-border: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    
    body { 
      background: var(--bg); 
      color: var(--text-main); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 12px;
    }
    
    .app-card { 
      background: var(--card-bg); 
      border-radius: 28px; 
      border: 1px solid var(--card-border); 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
      width: 100%; 
      max-width: 480px; 
      display: flex; 
      flex-direction: column; 
      height: 94vh; 
      overflow: hidden; 
    }
    
    /* HEADER */
    .header { 
      background: rgba(15, 23, 42, 0.95); 
      padding: 14px 20px; 
      display: flex; 
      align-items: center; 
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(10px);
    }

    .brand-group { display: flex; align-items: center; gap: 12px; }
    
    .avatar-glow { 
      width: 44px; 
      height: 44px; 
      background: linear-gradient(135deg, #6366f1, #a855f7); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 800; 
      font-size: 1.2rem; 
      color: white;
      box-shadow: 0 0 16px var(--accent-glow);
    }
    
    .title-group h1 { font-size: 1.05rem; font-weight: 700; color: white; }
    .title-group p { font-size: 0.75rem; color: var(--success); font-weight: 600; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 7px; height: 7px; background: var(--success); border-radius: 50%; display: inline-block; }

    /* QUICK SUGGESTION CHIPS */
    .chips-wrapper {
      padding: 10px 16px 4px;
      display: flex;
      gap: 8px;
      overflow-x: auto;
      white-space: nowrap;
      background: rgba(15, 23, 42, 0.4);
      border-bottom: 1px solid var(--card-border);
    }
    .chips-wrapper::-webkit-scrollbar { display: none; }
    
    .chip {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #cbd5e1;
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 0.78rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .chip:hover { background: var(--accent); color: white; border-color: var(--accent); }

    /* CHAT CONTAINER */
    .chat-container { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      scroll-behavior: smooth;
    }

    .message-group { display: flex; flex-direction: column; gap: 6px; max-width: 90%; }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.ai { align-self: flex-start; align-items: flex-start; }
    
    .message { padding: 12px 16px; border-radius: 20px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
    .user .message { background: var(--user-bubble); color: white; border-bottom-right-radius: 4px; }
    .ai .message { background: var(--ai-bubble); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--card-border); }

    /* STRUCTURAL LESSON CARDS */
    .lesson-card { 
      background: rgba(99, 102, 241, 0.1); 
      border: 1px solid rgba(99, 102, 241, 0.3); 
      border-radius: 16px; 
      padding: 12px 14px; 
      font-size: 0.85rem; 
      color: #e2e8f0; 
      width: 100%; 
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .lesson-section { display: flex; flex-direction: column; gap: 2px; }
    .lesson-label { font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #a5b4fc; }
    .lesson-text { font-size: 0.88rem; color: #f1f5f9; }

    /* AUDIO CONTROLS BAR */
    .audio-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .audio-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #38bdf8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .audio-btn:hover { background: rgba(56, 189, 248, 0.2); }

    .speed-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      cursor: pointer;
    }

    /* CONTROLS AREA */
    .controls { 
      padding: 14px 16px; 
      background: rgba(15, 23, 42, 0.95); 
      border-top: 1px solid var(--card-border); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
    }
    
    .input-row { display: flex; gap: 8px; width: 100%; align-items: center; }
    
    .text-input { 
      flex: 1; 
      background: #1e293b; 
      border: 1px solid #334155; 
      color: white; 
      padding: 12px 18px; 
      border-radius: 24px; 
      outline: none; 
      font-size: 0.92rem;
      transition: border 0.2s;
    }
    .text-input:focus { border-color: var(--accent); }
    
    .send-btn { 
      width: 44px; 
      height: 44px; 
      background: var(--accent); 
      border: none;
      color: white; 
      border-radius: 50%;
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 1.1rem;
      transition: transform 0.2s;
    }
    .send-btn:active { transform: scale(0.95); }

    .mic-btn { 
      width: 58px; 
      height: 58px; 
      background: linear-gradient(135deg, #8b5cf6, #6366f1); 
      border: none;
      color: white; 
      border-radius: 50%;
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      font-size: 1.6rem; 
      box-shadow: 0 6px 20px var(--accent-glow);
      transition: all 0.2s;
    }
    .mic-btn.listening { 
      background: #ef4444; 
      animation: pulse 1.2s infinite; 
      box-shadow: 0 0 24px rgba(239, 68, 68, 0.7); 
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    
    .status-text { font-size: 0.78rem; color: var(--text-muted); text-align: center; font-weight: 500; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- Header -->
  <div class="header">
    <div class="brand-group">
      <div class="avatar-glow">S</div>
      <div class="title-group">
        <h1>Seekho AI Coach</h1>
        <p><span class="status-dot"></span> Fast AI Mode Active</p>
      </div>
    </div>
  </div>

  <!-- Quick Practice Chips -->
  <div class="chips-wrapper">
    <div class="chip" onclick="quickSend('Mujhe coffee chahiye')">☕ Coffee chahiye</div>
    <div class="chip" onclick="quickSend('Aap kya kar rahe ho?')">❓ Aap kya kar rahe ho?</div>
    <div class="chip" onclick="quickSend('Kal mera interview hai')">💼 Kal interview hai</div>
    <div class="chip" onclick="quickSend('Aaj mausam bohot accha hai')">☀️ Mausam accha hai</div>
  </div>

  <!-- Chat Area -->
  <div class="chat-container" id="chatContainer">
    <div class="message-group ai">
      <div class="message">
        Namaste! 👋 Boliye ya Hinglish me type karein. Main turant English translation, response, aur grammar tips dungi!
      </div>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <button class="mic-btn" id="micBtn" title="Tap to Speak">🎤</button>
    <div class="input-row">
      <input type="text" class="text-input" id="textInput" placeholder="Boliye ya type karein (e.g. mujhe seekhna hai)...">
      <button class="send-btn" id="sendBtn">➔</button>
    </div>
    <div class="status-text" id="statusText">Tap mic to speak or type a sentence</div>
  </div>
</div>

<script>
  const chatContainer = document.getElementById('chatContainer');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  const textInput = document.getElementById('textInput');
  const statusText = document.getElementById('statusText');

  let currentSpeechSpeed = 0.9;

  // --- TTS VOICE ENGINE PRE-WARM ---
  let voices = [];
  function initVoices() {
    if ('speechSynthesis' in window) {
      voices = window.speechSynthesis.getVoices();
    }
  }
  initVoices();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = initVoices;
  }

  // --- SPEECH RECOGNITION (MIC) SETUP ---
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition = null;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = true; // Shows live transcript while speaking
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.innerText = '🎙️ Listening... Boliye!';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Tap mic to speak or type a sentence';
    };

    recognition.onresult = (e) => {
      const transcript = Array.from(e.results)
        .map(result => result[0].transcript)
        .join('');
      
      textInput.value = transcript;

      if (e.results[0].isFinal) {
        processUserInput(transcript);
      }
    };

    recognition.onerror = (e) => {
      isListening = false;
      micBtn.classList.remove('listening');
      if (e.error === 'not-allowed') {
        statusText.innerText = '⚠️ Mic blocked. Click URL lock icon to allow!';
      } else {
        statusText.innerText = 'Type your message below if mic is quiet.';
      }
    };
  } else {
    statusText.innerText = 'Mic not supported on this browser version. Type below!';
  }

  micBtn.addEventListener('click', async () => {
    warmupAudio();
    if (!SpeechRecognition) {
      alert('Speech recognition is not supported on this browser. Please type below!');
      return;
    }
    if (isListening) {
      recognition.stop();
      return;
    }
    try {
      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        await navigator.mediaDevices.getUserMedia({ audio: true });
      }
      recognition.start();
    } catch (err) {
      statusText.innerText = '⚠️ Microphone permission denied.';
    }
  });

  sendBtn.addEventListener('click', () => {
    warmupAudio();
    const val = textInput.value.trim();
    if (val) {
      processUserInput(val);
      textInput.value = '';
    }
  });

  textInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendBtn.click();
  });

  function quickSend(text) {
    textInput.value = text;
    sendBtn.click();
  }

  // --- FAST AI ENGINE WITH 3-SECOND SPEED LIMIT ---
  async function processUserInput(inputStr) {
    appendMessage(inputStr, 'user');
    statusText.innerText = '⚡ AI Processing...';

    // Race between cloud AI call and 3-second timeout
    let aiData = null;

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 3000); // 3-second strict timeout

      const response = await fetch('https://text.pollinations.ai/', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        signal: controller.signal,
        body: JSON.stringify({
          messages: [
            {
              role: 'system',
              content: 'You are an English Coach for Hindi speakers. Respond strictly in valid JSON: {"translation": "English translation", "reply": "Conversational reply in English", "tip": "Short fluency tip in Hinglish"}'
            },
            { role: 'user', content: inputStr }
          ],
          jsonMode: true
        })
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        const text = await response.text();
        const cleaned = text.replace(/```json/gi, '').replace(/```/gi, '').trim();
        aiData = JSON.parse(cleaned);
      }
    } catch (e) {
      console.log('Switching to instant local AI fallback:', e);
    }

    // Instant Local Fallback Engine if network takes >3s or fails
    if (!aiData || !aiData.translation) {
      aiData = generateInstantLocalResponse(inputStr);
    }

    // Render output
    const speechText = `${aiData.reply || aiData.translation}`;

    const lessonHTML = `
      <div class="lesson-card">
        <div class="lesson-section">
          <span class="lesson-label">🎯 Translation</span>
          <span class="lesson-text">${escapeHtml(aiData.translation)}</span>
        </div>
        <div class="lesson-section">
          <span class="lesson-label">💡 Fluency Tip</span>
          <span class="lesson-text">${escapeHtml(aiData.tip)}</span>
        </div>
      </div>
    `;

    appendMessage(aiData.reply, 'ai', lessonHTML, speechText);
    speakEnglish(speechText);
    statusText.innerText = 'Tap mic to speak or type a sentence';
  }

  // Built-in Instant AI Fallback Generator
  function generateInstantLocalResponse(inputStr) {
    const txt = inputStr.toLowerCase();

    if (txt.includes('coffee') || txt.includes('chai') || txt.includes('drink')) {
      return {
        translation: "I want a coffee.",
        reply: "Would you like some sugar and milk in your coffee?",
        tip: "'Chahiye' ke liye 'I want' ya polite tarike se 'I would like' bolein."
      };
    } else if (txt.includes('kar rahe') || txt.includes('what are you doing')) {
      return {
        translation: "What are you doing?",
        reply: "I am helping you practice English! What are you up to?",
        tip: "'Aap kya kar rahe ho' ke liye 'What are you doing?' ya casual me 'What are you up to?' bolein."
      };
    } else if (txt.includes('interview') || txt.includes('job') || txt.includes('kaam')) {
      return {
        translation: "I have an interview tomorrow.",
        reply: "Best of luck! Make sure to speak clearly and stay confident.",
        tip: "'Kal mera interview hai' = 'I have an interview tomorrow.' Here 'have' shows possession of schedule."
      };
    } else if (txt.includes('mausam') || txt.includes('weather') || txt.includes('garmi') || txt.includes('thand')) {
      return {
        translation: "The weather is very nice today.",
        reply: "Yes, it feels great outside today! Do you plan to go out?",
        tip: "Mausam ki baat karne ke liye hamesha 'It is...' se sentence start karein (e.g., 'It is pleasant today')."
      };
    } else {
      return {
        translation: `English expression for: "${inputStr}"`,
        translation: "I am practicing my English speaking skills.",
        reply: "That sounds awesome! Keep practicing every day to build fluency.",
        tip: "Sentences banate waqt Subject + Verb + Object rule hamesha follow karein."
      };
    }
  }

  function appendMessage(text, sender, lessonHTML = null, speechText = null) {
    const group = document.createElement('div');
    group.className = `message-group ${sender}`;
    
    let html = `<div class="message">${escapeHtml(text)}</div>`;
    if (lessonHTML) html += lessonHTML;

    if (sender === 'ai' && speechText) {
      const cleanSpeech = escapeHtml(speechText).replace(/'/g, "\\'");
      html += `
        <div class="audio-controls">
          <button class="audio-btn" onclick="speakEnglish('${cleanSpeech}')">🔊 Play</button>
          <button class="speed-btn" onclick="toggleSpeed(this, '${cleanSpeech}')">Speed: 0.9x</button>
        </div>
      `;
    }
    
    group.innerHTML = html;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function toggleSpeed(btn, text) {
    if (currentSpeechSpeed === 0.9) {
      currentSpeechSpeed = 0.75;
      btn.innerText = 'Speed: 0.75x (Slow)';
    } else {
      currentSpeechSpeed = 0.9;
      btn.innerText = 'Speed: 0.9x';
    }
    speakEnglish(text);
  }

  function escapeHtml(str) {
    if (!str) return '';
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function warmupAudio() {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  function speakEnglish(text) {
    if (!('speechSynthesis' in window)) return;
    
    window.speechSynthesis.cancel();
    if (!text) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = currentSpeechSpeed;

    if (voices.length === 0) voices = window.speechSynthesis.getVoices();
    const enVoice = voices.find(v => v.lang.startsWith('en'));
    if (enVoice) utterance.voice = enVoice;

    window.speechSynthesis.speak(utterance);
  }
</script>
</body>
</html>
