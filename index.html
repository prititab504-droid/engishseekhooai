<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>English Seekho AI — Smart Speaking Assistant</title>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    
    body { 
      background: #090d16; 
      color: #f1f5f9; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      min-height: 100vh; 
      padding: 12px;
    }
    
    .app-card { 
      background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%); 
      border-radius: 28px; 
      border: 1px solid rgba(255, 255, 255, 0.08); 
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); 
      width: 100%; 
      max-width: 460px; 
      display: flex; 
      flex-direction: column; 
      height: 94vh; 
      overflow: hidden; 
      position: relative;
    }
    
    /* App Header */
    .header { 
      background: rgba(30, 41, 59, 0.8); 
      backdrop-filter: blur(12px); 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
      padding: 16px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 10;
    }
    
    .brand { display: flex; align-items: center; gap: 12px; }
    .avatar-glow { 
      position: relative; 
      width: 44px; 
      height: 44px; 
      background: linear-gradient(135deg, #6366f1, #a855f7); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: 700; 
      font-size: 1.2rem; 
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.5);
    }
    
    .title-group h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: -0.2px; }
    .title-group p { font-size: 0.75rem; color: #94a3b8; display: flex; align-items: center; gap: 4px; }
    .status-dot { width: 6px; height: 6px; background: #22c55e; border-radius: 50%; display: inline-block; }
    
    /* Configuration Settings */
    .config-bar { 
      background: rgba(15, 23, 42, 0.9); 
      padding: 12px 16px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }
    .config-row { display: flex; gap: 8px; }
    .config-bar input, .config-bar select { 
      background: #1e293b; 
      border: 1px solid #334155; 
      color: #f1f5f9; 
      padding: 9px 12px; 
      border-radius: 10px; 
      font-size: 0.82rem; 
      outline: none; 
      transition: all 0.2s ease;
    }
    .config-bar input:focus, .config-bar select:focus { border-color: #6366f1; }
    .config-bar input { flex: 1; }
    .config-bar select { flex: 1; cursor: pointer; }

    /* Chat Messages Stream */
    .chat-container { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
      scroll-behavior: smooth; 
    }
    
    .chat-container::-webkit-scrollbar { width: 4px; }
    .chat-container::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

    .message-group { display: flex; flex-direction: column; gap: 6px; max-width: 88%; }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.ai { align-self: flex-start; align-items: flex-start; }
    
    .message { 
      padding: 12px 16px; 
      border-radius: 20px; 
      font-size: 0.92rem; 
      line-height: 1.5; 
      word-wrap: break-word; 
    }
    .user .message { 
      background: linear-gradient(135deg, #6366f1, #4f46e5); 
      color: #ffffff; 
      border-bottom-right-radius: 4px; 
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
    }
    .ai .message { 
      background: #1e293b; 
      color: #f8fafc; 
      border-bottom-left-radius: 4px; 
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Explanation & Audio Card */
    .explanation-card { 
      background: rgba(99, 102, 241, 0.08); 
      border: 1px solid rgba(99, 102, 241, 0.25); 
      border-radius: 14px; 
      padding: 10px 14px; 
      font-size: 0.82rem; 
      color: #c7d2fe; 
      display: flex; 
      flex-direction: column; 
      gap: 6px; 
      width: 100%; 
    }
    .explanation-card strong { color: #818cf8; font-weight: 600; display: flex; align-items: center; gap: 4px; }
    
    .audio-btn { 
      align-self: flex-start; 
      background: rgba(255, 255, 255, 0.08); 
      border: none; 
      color: #cbd5e1; 
      padding: 4px 10px; 
      border-radius: 12px; 
      font-size: 0.75rem; 
      cursor: pointer; 
      display: flex; 
      align-items: center; 
      gap: 4px; 
      margin-top: 4px;
      transition: background 0.2s ease;
    }
    .audio-btn:hover { background: rgba(255, 255, 255, 0.15); }

    /* Suggestion Chips */
    .chips-wrapper { 
      display: flex; 
      gap: 8px; 
      overflow-x: auto; 
      padding: 0 16px 8px; 
      margin-top: auto; 
    }
    .chips-wrapper::-webkit-scrollbar { display: none; }
    .chip { 
      background: rgba(255, 255, 255, 0.05); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      color: #94a3b8; 
      padding: 6px 12px; 
      border-radius: 16px; 
      font-size: 0.75rem; 
      white-space: nowrap; 
      cursor: pointer; 
      transition: all 0.2s ease; 
    }
    .chip:hover { background: rgba(99, 102, 241, 0.2); color: #f1f5f9; border-color: #6366f1; }

    /* Mic & Action Controls */
    .controls { 
      padding: 16px; 
      background: rgba(30, 41, 59, 0.9); 
      border-top: 1px solid rgba(255, 255, 255, 0.08); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
    }
    
    .mic-container { position: relative; }
    .mic-btn { 
      width: 68px; 
      height: 68px; 
      border-radius: 50%; 
      background: linear-gradient(135deg, #6366f1, #4f46e5); 
      border: none; 
      color: white; 
      font-size: 1.7rem; 
      cursor: pointer; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      transition: all 0.2s ease; 
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4); 
    }
    .mic-btn:hover { transform: scale(1.06); }
    .mic-btn.listening { 
      background: linear-gradient(135deg, #ef4444, #dc2626); 
      animation: pulse 1.4s infinite; 
      box-shadow: 0 8px 24px rgba(239, 68, 68, 0.5); 
    }

    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 16px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
    
    .status-text { font-size: 0.8rem; color: #94a3b8; font-weight: 500; text-align: center; }
  </style>
</head>
<body>

<div class="app-card">
  <!-- Header -->
  <div class="header">
    <div class="brand">
      <div class="avatar-glow">S</div>
      <div class="title-group">
        <h1>English Seekho AI</h1>
        <p><span class="status-dot"></span> Hindi & English Practice Coach</p>
      </div>
    </div>
  </div>

  <!-- Configuration Bar -->
  <div class="config-bar">
    <div class="config-row">
      <input type="password" id="apiKey" placeholder="Paste OpenAI Key (optional)">
    </div>
    <div class="config-row">
      <select id="langSelect">
        <option value="hi-IN" selected>🎙️ Listen in Hindi / Hinglish</option>
        <option value="en-US">🎙️ Listen in English</option>
      </select>
      <select id="speedSelect">
        <option value="0.8">0.8x Speed</option>
        <option value="0.9" selected>0.9x Speed</option>
        <option value="1.0">1.0x Speed</option>
      </select>
    </div>
  </div>

  <!-- Dynamic Chat Stream -->
  <div class="chat-container" id="chatContainer">
    <div class="message-group ai">
      <div class="message">
        Namaste! Aap Hindi ya English me bol sakte hain. Main usko English me translate karke samjhaungi!
      </div>
    </div>
  </div>

  <!-- Quick Practice Suggestion Chips -->
  <div class="chips-wrapper">
    <div class="chip" onclick="sendQuickPrompt('Mujhe English seekhna hai')">"Mujhe English seekhna hai"</div>
    <div class="chip" onclick="sendQuickPrompt('Kaise ho aap?')">"Kaise ho aap?"</div>
    <div class="chip" onclick="sendQuickPrompt('Mera naam Rahul hai')">"Mera naam Rahul hai"</div>
  </div>

  <!-- Speech Controls -->
  <div class="controls">
    <div class="mic-container">
      <button class="mic-btn" id="micBtn">🎤</button>
    </div>
    <div class="status-text" id="statusText">Tap microphone to start speaking</div>
  </div>
</div>

<script>
  // DOM Elements
  const chatContainer = document.getElementById('chatContainer');
  const micBtn = document.getElementById('micBtn');
  const statusText = document.getElementById('statusText');
  const apiKeyInput = document.getElementById('apiKey');
  const langSelect = document.getElementById('langSelect');
  const speedSelect = document.getElementById('speedSelect');

  let speechRate = 0.9;
  let currentLang = 'hi-IN';

  // Web Speech API Setup
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = currentLang;

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.innerText = 'Suno raha hoon... Boliye (Listening...)';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Tap microphone to speak';
    };

    recognition.onresult = async (e) => {
      const transcript = e.results[0][0].transcript;
      appendUserMessage(transcript);
      await processLanguageResponse(transcript);
    };

    recognition.onerror = () => {
      statusText.innerText = 'Voice recognition error. Please try again.';
    };
  }

  langSelect.addEventListener('change', (e) => {
    currentLang = e.target.value;
  });

  speedSelect.addEventListener('change', (e) => {
    speechRate = parseFloat(e.target.value);
  });

  micBtn.addEventListener('click', () => {
    if (!SpeechRecognition) {
      alert('Speech API is not supported on this browser. Use Chrome or Edge.');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      recognition.lang = currentLang;
      recognition.start();
    }
  });

  function sendQuickPrompt(text) {
    appendUserMessage(text);
    processLanguageResponse(text);
  }

  function appendUserMessage(text) {
    const group = document.createElement('div');
    group.className = 'message-group user';
    group.innerHTML = `<div class="message">${escapeHtml(text)}</div>`;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function appendAiMessage(englishReply, explanation) {
    const group = document.createElement('div');
    group.className = 'message-group ai';
    
    let html = `<div class="message">${escapeHtml(englishReply)}</div>`;
    if (explanation) {
      html += `
        <div class="explanation-card">
          <strong>💡 Translation & Tip:</strong>
          <span>${escapeHtml(explanation)}</span>
        </div>`;
    }
    
    // Add Re-play Audio Button
    html += `
      <button class="audio-btn" onclick="speakText('${escapeHtml(englishReply)}')">
        🔊 Listen English
      </button>`;
    
    group.innerHTML = html;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/'/g, "\\'").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function speakText(text) {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = speechRate;
      window.speechSynthesis.speak(utterance);
    }
  }

  async function processLanguageResponse(userInput) {
    statusText.innerText = 'Translating & thinking...';
    const key = apiKeyInput.value.trim();

    if (key) {
      try {
        const response = await fetch('https://api.openai.com/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${key}`
          },
          body: JSON.stringify({
            model: 'gpt-4o-mini',
            response_format: { type: "json_object" },
            messages: [
              { 
                role: 'system', 
                content: `You are an AI English coach for Hindi native speakers. Output JSON format:
                {
                  "english_reply": "Natural English response/translation",
                  "explanation_hindi": "Hinglish explanation of grammar/vocabulary."
                }` 
              },
              { role: 'user', content: userInput }
            ]
          })
        });

        const data = await response.json();
        const parsed = JSON.parse(data.choices[0].message.content);
        
        appendAiMessage(parsed.english_reply, parsed.explanation_hindi);
        speakText(parsed.english_reply);
      } catch (err) {
        appendAiMessage("API Error: Please check your key.", "OpenAI API Key verify karein.");
      }
    } else {
      // Intelligent offline demo responses
      let englishReply = `I understand! You said: "${userInput}". Let's practice more!`;
      let hindiExplanation = `Aapne bola: "${userInput}". Isko English me daily practice karein.`;

      const lower = userInput.toLowerCase();
      if (lower.includes("kaise ho") || lower.includes("kaise h")) {
        englishReply = "How are you? I am doing great!";
        hindiExplanation = "'Kaise ho' ko English me 'How are you?' bolte hain.";
      } else if (lower.includes("naam") || lower.includes("name")) {
        englishReply = "My name is Sophia. What is your name?";
        hindiExplanation = "Apna naam batane ke liye: 'My name is...' use karein.";
      } else if (lower.includes("seekhna") || lower.includes("learn")) {
        englishReply = "I want to learn English fluently!";
        hindiExplanation = "'Mujhe English seekhna hai' ko 'I want to learn English' bolenge.";
      }

      appendAiMessage(englishReply, hindiExplanation);
      speakText(englishReply);
    }
    statusText.innerText = 'Tap microphone to speak';
  }
</script>
</body>
</html>
