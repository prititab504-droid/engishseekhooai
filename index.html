<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart English AI Coach</title>
  
  <!-- Puter AI Engine Library -->
  <script src="https://js.puter.com/v2/"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0b0f19; color: #f1f5f9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    
    .app-card { 
      background: #1e293b; 
      border-radius: 20px; 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6); 
      width: 100%; 
      max-width: 480px; 
      display: flex; 
      flex-direction: column; 
      height: 94vh; 
      overflow: hidden; 
    }
    
    .header { 
      background: #0f172a; 
      padding: 16px 20px; 
      display: flex; 
      align-items: center; 
      gap: 12px; 
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    
    .avatar-glow { 
      width: 42px; 
      height: 42px; 
      background: linear-gradient(135deg, #3b82f6, #8b5cf6); 
      border-radius: 50%; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 1.2rem; 
      color: white;
    }
    
    .title-group h1 { font-size: 1.1rem; font-weight: 700; color: white;}
    .title-group p { font-size: 0.75rem; color: #38bdf8; }
    
    .chat-container { 
      flex: 1; 
      padding: 16px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 16px; 
    }

    .message-group { display: flex; flex-direction: column; gap: 6px; max-width: 92%; }
    .message-group.user { align-self: flex-end; align-items: flex-end; }
    .message-group.ai { align-self: flex-start; align-items: flex-start; }
    
    .message { padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.5; word-wrap: break-word; }
    .user .message { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }
    .ai .message { background: #334155; color: #f8fafc; border-bottom-left-radius: 4px; }

    /* AI Lesson Box */
    .lesson-box { 
      background: rgba(139, 92, 246, 0.15); 
      border: 1px solid rgba(139, 92, 246, 0.4); 
      border-radius: 14px; 
      padding: 12px; 
      font-size: 0.85rem; 
      color: #e9d5ff; 
      width: 100%; 
      margin-top: 4px;
    }

    .replay-btn {
      margin-top: 6px;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #38bdf8;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.78rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .controls { 
      padding: 16px; 
      background: #0f172a; 
      border-top: 1px solid rgba(255, 255, 255, 0.08); 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      gap: 10px; 
    }
    
    .input-row { display: flex; gap: 8px; width: 100%; }
    .text-input { 
      flex: 1; 
      background: #1e293b; 
      border: 1px solid #334155; 
      color: white; 
      padding: 12px 16px; 
      border-radius: 24px; 
      outline: none; 
      font-size: 0.9rem;
    }
    
    .send-btn, .mic-btn { 
      border: none; 
      color: white; 
      cursor: pointer; 
      border-radius: 50%; 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      transition: all 0.2s ease;
    }
    
    .send-btn { width: 44px; height: 44px; background: #3b82f6; font-size: 1.1rem; }
    .mic-btn { width: 56px; height: 56px; background: linear-gradient(135deg, #8b5cf6, #3b82f6); font-size: 1.5rem; }
    .mic-btn.listening { background: #ef4444; animation: pulse 1.2s infinite; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    
    .status-text { font-size: 0.8rem; color: #94a3b8; text-align: center; }
  </style>
</head>
<body>

<div class="app-card">
  <div class="header">
    <div class="avatar-glow">AI</div>
    <div class="title-group">
      <h1>Smart AI English Coach</h1>
      <p>● Live Translation & Intelligence Active</p>
    </div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="message-group ai">
      <div class="message">
        Namaste! 🎙️ Boliye ya Hinglish/Hindi me type karein. Main real-time translation, grammar explanations, aur fluency coaching dungi!
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="mic-btn" id="micBtn">🎤</button>
    <div class="input-row">
      <input type="text" class="text-input" id="textInput" placeholder="Kuch bhi Hindi ya Hinglish me likho...">
      <button class="send-btn" id="sendBtn">➔</button>
    </div>
    <div class="status-text" id="statusText">Tap mic to speak or type a sentence</div>
  </div>
</div>

<script>
  const chatContainer = document.getElementById('chatContainer');
  const micBtn = document.getElementById('micBtn');
  const sendBtn = document.getElementById('sendBtn');
  const textInput = document.getElementById('textInput');
  const statusText = document.getElementById('statusText');

  // Speech Synthesis setup
  let voices = [];
  function loadVoices() {
    if ('speechSynthesis' in window) {
      voices = window.speechSynthesis.getVoices();
    }
  }
  loadVoices();
  if ('speechSynthesis' in window) {
    window.speechSynthesis.onvoiceschanged = loadVoices;
  }

  // Web Speech Recognition
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  let recognition;
  let isListening = false;

  if (SpeechRecognition) {
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.lang = 'hi-IN';

    recognition.onstart = () => {
      isListening = true;
      micBtn.classList.add('listening');
      statusText.innerText = 'Listening... Speak now';
    };

    recognition.onend = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Tap mic to speak or type a sentence';
    };

    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      processUserInput(transcript);
    };

    recognition.onerror = () => {
      isListening = false;
      micBtn.classList.remove('listening');
      statusText.innerText = 'Mic issue. Try typing your text below!';
    };
  }

  micBtn.addEventListener('click', async () => {
    speakEnglish(''); // Trigger audio engine warm-up
    if (!SpeechRecognition) {
      alert('Voice input not supported in this browser. Please use text typing!');
      return;
    }
    if (isListening) {
      recognition.stop();
    } else {
      try {
        if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
          await navigator.mediaDevices.getUserMedia({ audio: true });
        }
        recognition.start();
      } catch (err) {
        statusText.innerText = '⚠️ Microphone permission denied.';
      }
    }
  });

  sendBtn.addEventListener('click', () => {
    speakEnglish('');
    const input = textInput.value.trim();
    if (input) {
      processUserInput(input);
      textInput.value = '';
    }
  });

  textInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') sendBtn.click();
  });

  // AI Processing Logic using Puter AI
  async function processUserInput(inputStr) {
    appendMessage(inputStr, 'user');
    statusText.innerText = 'AI Thinking & Translating...';

    // Advanced prompt forcing structured learning output
    const prompt = `
      You are an expert English Language Coach for Hindi speakers.
      The user said: "${inputStr}"

      Provide output strictly in this JSON format (no extra text around JSON):
      {
        "englishTranslation": "Direct natural English translation of what user said",
        "conversationalReply": "Your natural English response to continue conversation",
        "teachingTips": "Explanation in Hinglish about grammar/vocabulary used and how to say it more fluently."
      }
    `;

    try {
      // Call AI Engine
      const aiResponse = await puter.ai.chat(prompt);
      const cleanJson = aiResponse.toString().replace(/```json/g, '').replace(/```/g, '').trim();
      const data = JSON.parse(cleanJson);

      const combinedSpeech = `${data.englishTranslation}. ${data.conversationalReply}`;
      
      const lessonHTML = `
        <div class="lesson-box">
          <p><strong>🎯 Translation:</strong> ${data.englishTranslation}</p>
          <br>
          <p><strong>💡 Fluency Coach:</strong> ${data.teachingTips}</p>
        </div>
      `;

      appendMessage(data.conversationalReply, 'ai', lessonHTML, combinedSpeech);
      speakEnglish(combinedSpeech);
      statusText.innerText = 'Tap mic to speak or type a sentence';

    } catch (error) {
      console.error(error);
      const fallbackMsg = "I couldn't process that. Please try again!";
      appendMessage(fallbackMsg, 'ai');
      statusText.innerText = 'Error connecting to AI. Try again.';
    }
  }

  function appendMessage(text, sender, lessonHTML = null, fullAudioText = null) {
    const group = document.createElement('div');
    group.className = `message-group ${sender}`;
    
    let html = `<div class="message">${escapeHtml(text)}</div>`;
    if (lessonHTML) html += lessonHTML;

    if (sender === 'ai' && (fullAudioText || text)) {
      const speechStr = escapeHtml(fullAudioText || text).replace(/'/g, "\\'");
      html += `<button class="replay-btn" onclick="speakEnglish('${speechStr}')">🔊 Listen Audio</button>`;
    }
    
    group.innerHTML = html;
    chatContainer.appendChild(group);
    chatContainer.scrollTop = chatContainer.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function speakEnglish(text) {
    if (!('speechSynthesis' in window)) return;
    
    window.speechSynthesis.cancel();
    if (!text) return;

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    utterance.rate = 0.9;

    if (voices.length === 0) voices = window.speechSynthesis.getVoices();
    const englishVoice = voices.find(v => v.lang.startsWith('en'));
    if (englishVoice) utterance.voice = englishVoice;

    window.speechSynthesis.speak(utterance);
  }
</script>
</body>
</html>
